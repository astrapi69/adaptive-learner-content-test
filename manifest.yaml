# Wurzel-Manifest des Test-/Starter-Repos.
#
# Dies ist ein Starter-Kit: ein einziges Beispiel-Set zeigt auf die
# mitgelieferte Inception-Effekt-Lektion. Forke das Repo, ersetze die
# Lektion unter sets/de/inception-example/lessons/ durch deine eigene
# (oder lege neue Sets unter sets/<quellsprache>/<ziel-level>/ an) und
# registriere sie hier. Validieren mit:
#
#     python3 scripts/validate_content.py
#
# Anleitung: docs/GETTING-STARTED.md
schema_version: '1.2'
name: Adaptive Learner — Test- und Starter-Inhalte
description: >-
  Starter-Kit-Inhalte für eigene Adaptive-Learner-Lektionen.
  Enthält ein lauffähiges Beispiel-Set (Inception-Effekt) als
  Vorlage; forke das Repo und erstelle deine eigenen Inhalte.
sets:
  - id: inception-example-from-de
    title: Inception-Effekt (Beispiel)
    title_native: Inception-Effekt (Beispiel)
    target_language: de
    source_language: de
    domain: psychology
    level: A1
    path: sets/de/inception-example
    version: '1.0.0'
    lesson_count: 1
    domain_label: Psychologie
    description: >-
      Beispiel-Set: eine vollständige Sachthema-Lektion zur
      Kommunikationspsychologie (10 Karten, 3 Theorieschritte,
      8 Übungen) als Vorlage für eigene Inhalte.
    tags:
      - beispiel
      - psychology
      - starter
  - id: ansible-qe-from-de
    title: Ansible-Grundlagen für Quality Engineering
    title_native: Ansible-Grundlagen für Quality Engineering
    target_language: de
    source_language: de
    domain: technology
    level: B1
    path: sets/de/ansible-qe
    version: '1.0.0'
    lesson_count: 8
    domain_label: Technologie
    description: >-
      Ansible für Quality Engineering: acht Lektionen mit Theorie und
      Übungen (matching, cloze, free_text, word_tiles) zu Playbooks,
      Testing-Modulen, Testumgebungen und Inventory-Targeting.
    tags:
      - ansible
      - devops
      - qa
      - automation
  - id: react-grundlagen-from-de
    title: React-Grundlagen (Einsteiger)
    title_native: React-Grundlagen (Einsteiger)
    target_language: de
    source_language: de
    domain: programming
    level: A2
    path: sets/de/react-grundlagen
    version: '1.0.0'
    lesson_count: 5
    domain_label: Programmierung
    description: >-
      React-Grundlagen auf Deutsch für Einsteiger: fünf Lektionen mit
      überwiegend Multiple-Choice-Übungen (picture_choice mit plausiblen
      Distraktoren) plus wenigen Lückentext-Items (cloze) zu React als
      Library, Komponenten, JSX, Props, State/useState, Events und
      Grundprinzipien.
    tags:
      - react
      - javascript
      - frontend
      - grundlagen
  - id: fuehrerschein-uebung-from-de
    title: Führerscheinprüfung (Übungsfragen)
    title_native: Führerscheinprüfung (Übungsfragen)
    target_language: de
    source_language: de
    domain: knowledge
    level: A2
    path: sets/de/fuehrerschein-uebung
    version: '1.0.0'
    lesson_count: 4
    domain_label: Verkehrskunde
    description: >-
      Ausschließlich Multiple-Choice: eigene, frei formulierte Übungsfragen
      im Stil einer Führerscheinprüfung (Beispiel Deutschland) über freie
      Fakten der deutschen StVO — Vorfahrt, Geschwindigkeit/Abstand,
      Alkohol/Fahrtüchtigkeit und Parken/Halten. Keine amtlichen Fragen oder
      Bilder, kein Anspruch auf Prüfungsechtheit. Test-Set zum Festnageln der
      MC-Mechanik (MC im Schema als cloze select-mode).
    tags:
      - knowledge
      - verkehr
      - multiple-choice
      - test
  - id: react-fortgeschritten-from-de
    title: React Fortgeschritten (Teil 2)
    title_native: React Fortgeschritten (Teil 2)
    target_language: de
    source_language: de
    domain: programming
    level: B1
    path: sets/de/react-fortgeschritten
    version: '1.0.0'
    lesson_count: 8
    domain_label: Programmierung
    description: >-
      Fortsetzung von „React-Grundlagen" (Teil 2, Fortgeschritten, B1): acht
      Lektionen mit Schwerpunkt Multiple-Choice — Single-Answer als cloze
      select-mode und „Wähle alle zutreffenden" als cloze multiselect — plus
      matching und kurze Lückentext-Items. Themen: useEffect, Datenfetching,
      useContext, useRef, Performance, Listen/Keys, Formulare, Komposition
      und Patterns. React-18, Hooks-first, konzeptuell.
    tags:
      - react
      - javascript
      - frontend
      - fortgeschritten
      - multiple-choice
