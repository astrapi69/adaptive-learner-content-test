# Wurzel-Manifest des Test-/Starter-Repos.
#
# Dies ist ein Starter-Kit: die mitgelieferte Beispiel-Lektion liegt
# unter examples/inception-effekt/ zum Nachlesen. Forke das Repo, lege
# eigene Sets unter sets/<quellsprache>/<set-ordner>/ an und
# registriere sie hier. Validieren mit:
#
#     python3 scripts/validate_content.py
#
# Anleitung: docs/GETTING-STARTED.md
schema_version: '1.2'
name: Adaptive Learner — Test- und Starter-Inhalte
description: >-
  Starter-Kit-Inhalte für eigene Adaptive-Learner-Lektionen.
  Enthält lauffähige Test-Sets als Vorlage; forke das Repo und
  erstelle deine eigenen Inhalte.
sets:
  - id: fuehrerschein-uebung-from-de
    title: Führerscheinprüfung (Übungsfragen)
    title_native: Führerscheinprüfung (Übungsfragen)
    target_language: de
    source_language: de
    domain: knowledge
    level: A2
    path: sets/de/fuehrerschein-uebung
    version: '1.0.0'
    lesson_count: 5
    domain_label: Verkehrskunde
    description: >-
      Ausschließlich Multiple-Choice: eigene, frei formulierte Übungsfragen
      im Stil einer Führerscheinprüfung (Beispiel Deutschland) über freie
      Fakten der deutschen StVO — Vorfahrt, Geschwindigkeit/Abstand,
      Alkohol/Fahrtüchtigkeit, Parken/Halten sowie Rettungsgasse und
      Einsatzfahrzeuge. Keine amtlichen Fragen oder Bilder, kein Anspruch
      auf Prüfungsechtheit. Test-Set zum Festnageln der MC-Mechanik (MC im
      Schema als cloze select-mode und als nativer multiple_choice-Typ,
      Schema v1.6).
    tags:
      - knowledge
      - verkehr
      - multiple-choice
      - test
  - id: graded-quiz-demo-from-de
    title: Graded-Quiz Demo (Test)
    title_native: Graded-Quiz Demo (Test)
    target_language: de
    source_language: de
    domain: knowledge
    level: A1
    path: sets/de/graded-quiz-demo
    version: '1.0.0'
    lesson_count: 1
    domain_label: Test
    description: >-
      Eine Lektion: Theorie plus fuenf Aufgaben (multiple_choice, cloze
      select, cloze type) und ein benotetes Quiz ueber den Extension-Typ
      ext:al-graded-quiz.
    tags:
      - knowledge
      - test
      - graded-quiz
      - extension
