# Wurzel-Manifest des Test-/Starter-Repos.
#
# Dies ist ein Starter-Kit: eine Beispiel-Lektion zum Nachlesen liegt im
# offiziellen Repo adaptive-learner-content unter
# examples/inception-effekt/. Forke das Repo, lege
# eigene Sets unter sets/<quellsprache>/<set-ordner>/ an und
# registriere sie hier. Validieren mit:
#
#     python3 scripts/validate_content.py
#
# Anleitung: docs/GETTING-STARTED.md
schema_version: '1.2'
name: Adaptive Learner - Test- und Starter-Inhalte
description: >-
  Starter-Kit-Inhalte für eigene Adaptive-Learner-Lektionen.
  Enthält lauffähige Test-Sets als Vorlage; forke das Repo und
  erstelle deine eigenen Inhalte.
sets:
  - id: graded-quiz-demo-from-de
    title: Graded-Quiz Demo (Test)
    title_native: Graded-Quiz Demo (Test)
    target_language: de
    source_language: de
    domain: knowledge
    level: A1
    path: sets/de/graded-quiz-demo
    version: '1.0.0'
    lesson_count: 1
    # Konformanz-Fixture (E-EXT-UNSUPPORTED-Negativfall), kein Lerner-Inhalt:
    # Engine validiert das Set weiter, Consumer-Apps zeigen es nicht an.
    visibility: hidden
    description: >-
      Eine Lektion: Theorie plus fünf Aufgaben (multiple_choice, cloze
      select, cloze type) und ein benotetes Quiz über den Extension-Typ
      ext:al-graded-quiz.
    tags:
      - knowledge
      - test
      - graded-quiz
      - extension
  # Pilot für den evaluation-Block (learn-content-engine#227,
  # adaptive-learner#3736). Der Block steht identisch im Set-Manifest, sonst
  # entschiede die gelesene Datei, ob er greift. Testszenario im README.
  - id: evaluation-pilot-from-de
    title: Bewertungs-Pilot (Test)
    title_native: Bewertungs-Pilot (Test)
    target_language: de
    source_language: de
    domain: knowledge
    level: none
    path: sets/de/evaluation-pilot
    version: '1.0.0'
    lesson_count: 1
    evaluation:
      scheme: pass_fail
      pass_percent: 60
      title: Pilotprüfung
    description: >-
      Test-Set für den Bewertungs-Block (evaluation): Bestehensgrenze 60
      Prozent. Zehn gleichwertige Aufgaben, sodass sich ein Durchlauf mit
      genau 70 Prozent (7 von 10) gezielt erreichen lässt.
    tags:
      - knowledge
      - test
      - evaluation
  # Kontrolle zum Pilot: dieselbe Lektion, kein evaluation-Block.
  - id: evaluation-pilot-control-from-de
    title: Bewertungs-Pilot, Kontrolle (Test)
    title_native: Bewertungs-Pilot, Kontrolle (Test)
    target_language: de
    source_language: de
    domain: knowledge
    level: none
    path: sets/de/evaluation-pilot-control
    version: '1.0.0'
    lesson_count: 1
    description: >-
      Kontroll-Set zum Bewertungs-Pilot: dieselbe Lektion ohne
      Bewertungs-Block, hier gilt die eigene Exam-Schwelle der App.
    tags:
      - knowledge
      - test
      - evaluation
