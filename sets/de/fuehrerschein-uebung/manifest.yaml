# Set-Manifest: Führerscheinprüfung (Übungsfragen) — deutschsprachig.
#
# Zweck (Test-Repo): der fokussierte Ende-zu-Ende-Test der Multiple-Choice-
# Mechanik. Das Set besteht AUSSCHLIESSLICH aus MC-Aufgaben — im Schema
