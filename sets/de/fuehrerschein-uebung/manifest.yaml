# KEIN Anspruch auf Prüfungsechtheit.
#
# Sachthema-Set (domain: knowledge): Material und Erklärung sind beide auf
# Deutsch (source_language == target_language); der Set-Ordner trägt einen
# Themennamen. Der Content-Loader liest metadata.lessons für die Dateiliste.
